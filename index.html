<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>মিট ক্লাব রমাদান – হিসাব</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#faf6ec;--card:#fff;--ink:#1f2a24;--g:#14532d;--g2:#1f7a45;--gold:#b8892b;--line:#e6dcc3;--mut:#6b7a70;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14201a;--card:#1c2b23;--ink:#eee8d6;--g:#8fd0a3;--g2:#2f8a56;--gold:#d9ae55;--line:#2f4439;--mut:#a3b3a9}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",Kalpurush,sans-serif;font-size:16px}
.wm-logo{position:fixed;top:8px;left:8px;width:90px;height:90px;border-radius:50%;object-fit:cover;opacity:.9;z-index:5;pointer-events:none}
.wm-center{position:fixed;top:50%;left:50%;width:min(70vw,440px);height:min(70vw,440px);transform:translate(-50%,-50%);border-radius:50%;object-fit:cover;opacity:.04;z-index:4;pointer-events:none}
.wm-name{position:fixed;bottom:8px;left:12px;font-size:20px;font-weight:700;color:var(--g);opacity:.3;z-index:5;pointer-events:none}
header{text-align:center;padding:18px 110px 8px}
header h1{margin:0;font-size:26px;color:var(--g)}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.bism{font-size:20px;color:var(--gold);margin-bottom:4px}
nav{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;padding:10px}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:20px;font:inherit;cursor:pointer}
nav button.on{background:var(--g2);color:#fff;border-color:var(--g2)}
main{max-width:980px;margin:0 auto;padding:6px 12px 70px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
select,input[type=text],input[type=number],input[type=tel],input[type=password]{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.btn{font:inherit;border:0;border-radius:8px;padding:7px 14px;cursor:pointer;background:var(--g2);color:#fff}
.btn.alt{background:var(--gold);color:#fff}.btn.red{background:#b3372f}.btn.sm{padding:4px 10px;font-size:14px}
.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.stat div{flex:1;min-width:140px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.stat b{display:block;font-size:22px;color:var(--g)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;white-space:nowrap}
th{background:var(--g2);color:#fff;position:sticky;top:0}
td.c,th.c{text-align:center}td.r,th.r{text-align:right}
.ok{color:var(--g2);font-weight:700}.no{color:#b3372f}
#printArea{display:none}
@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important}#printArea img{width:100%}}
</style>
</head>
<body>
<img class="wm-logo" id="wmLogo" alt="">
<img class="wm-center" id="wmCenter" alt="">
<div class="wm-name">মোঃ হাবিবুর রহমান নয়ন</div>
<header>
  <div class="bism">بسم الله الرحمن الرحيم</div>
  <h1>মিট ক্লাব রমাদান (প্রতিষ্ঠা-২০২৫)</h1>
  <p>নতুন রাস্তা (বাঁশ পট্টি), খুলনা, বাংলাদেশ</p>
</header>
<nav id="nav"></nav>
<main id="app"></main>

  <select onchange="Y=+this.value;render()">${yOpts()}</select><select onchange="Mo=+this.value;render()">${mOpts()}</select>
  <button class="btn alt" onclick="dlMonth()">মাসিক রিপোর্ট JPEG</button><button class="btn alt" onclick="prMonth()">প্রিন্ট</button></div>
  <div class="stat"><div>এই মাসে জমা<b>${tk(tot)}</b></div><div>জমাদানকারী<b>${bn(cnt)} / ${bn(S.members.length)} জন</b></div><div>বাকি সদস্য<b>${bn(S.members.length-cnt)} জন</b></div><div>এই বছরে মোট<b>${tk(yearTotal(Y))}</b></div></div>
  <div class="tw"><table><tr><th class="c">ক্র.নং</th><th>নাম</th>${A?'<th>মোবাইল নম্বর</th><th>রক্তের গ্রুপ</th>':''}<th class="c">জমা</th><th class="r">টাকা</th><th>টোকেন</th></tr>
  ${S.members.map((m,i)=>{const p=paid(Y,Mo,m.id);return `<tr><td class="c">${bn(i+1)}</td><td>${m.name}</td>${A?`<td><input type="tel" inputmode="tel" value="${m.mobile||''}" placeholder="01XXXXXXXXX" style="width:140px" onchange="setMob(${m.id},this.value)"></td><td><select onchange="setBg(${m.id},this.value)">${bgOpts(m.blood)}</select></td>`:''}<td class="c"><input type="checkbox" ${p?'checked':''} ${A?'':'disabled'} onchange="tog(${m.id},this.checked)"></td><td class="r ${p?'ok':'no'}">${p?tk(p):'বাকি'}</td><td>${p?`<button class="btn sm" onclick="dlTok(${m.id})">ডাউনলোড</button> <button class="btn sm alt" onclick="prTok(${m.id})">প্রিন্ট</button>`:'—'}</td></tr>`}).join('')}
  </table></div></div>`;
}
function tog(id,on){const k=key(Y,Mo);S.pay[k]=S.pay[k]||{};if(on)S.pay[k][id]=S.fee;else delete S.pay[k][id];save();render()}

function vYear(){
  $('#app').innerHTML=`<div class="card"><div class="row"><select onchange="Y=+this.value;render()">${yOpts()}</select>
  <button class="btn alt" onclick="dlYear()">বার্ষিক রিপোর্ট JPEG</button><button class="btn alt" onclick="prYear()">প্রিন্ট</button></div>
  <div class="stat"><div>${bn(Y)} সালে মোট জমা<b>${tk(yearTotal(Y))}</b></div></div>
  <div class="tw"><table><tr><th>নাম</th>${SM.map(s=>`<th class="c">${s}</th>`).join('')}<th class="r">মোট</th></tr>
  ${S.members.map(m=>`<tr><td>${m.name}</td>${SM.map((s,i)=>`<td class="c ${paid(Y,i,m.id)?'ok':'no'}">${paid(Y,i,m.id)?'✓':'·'}</td>`).join('')}<td class="r">${tk(memYear(Y,m.id))}</td></tr>`).join('')}
  <tr><th>মাসিক মোট</th>${SM.map((s,i)=>`<th class="c">${bn(monthTotal(Y,i))}</th>`).join('')}<th class="r">${bn(yearTotal(Y))}</th></tr></table></div></div>`;
}

function vMem(){
  $('#app').innerHTML=`<div class="card"><div class="row"><select onchange="sel=+this.value;render()">${memOpts()}</select><select onchange="Y=+this.value;render()">${yOpts()}</select>
  <button class="btn alt" onclick="dlMem()">JPEG ডাউনলোড</button><button class="btn alt" onclick="prMem()">প্রিন্ট</button></div>
  <div class="stat"><div>${bn(Y)} সালে জমা<b>${tk(memYear(Y,sel))}</b></div><div>সর্বমোট জমা<b>${tk(memAll(sel))}</b></div></div>
  <div class="tw"><table><tr><th>মাস</th><th class="r">জমা</th></tr>${MON.map((n,i)=>`<tr><td>${n} ${bn(Y)}</td><td class="r ${paid(Y,i,sel)?'ok':'no'}">${paid(Y,i,sel)?tk(paid(Y,i,sel)):'বাকি'}</td></tr>`).join('')}</table></div></div>`;
}

function vSet(){
  $('#app').innerHTML=`<div class="card"><div class="row"><b>মাসিক চাঁদা (টাকা):</b><input type="number" value="${S.fee}" min="0" style="width:110px" onchange="setFee(this.value)"><small style="color:var(--mut)">নতুন জমার ক্ষেত্রে প্রযোজ্য হবে</small></div>
  <div class="row"><input type="text" id="nn" placeholder="নতুন সদস্যের নাম" style="flex:1;min-width:180px"><input type="tel" id="nm" placeholder="মোবাইল নম্বর (ঐচ্ছিক)" style="width:190px"><select id="nb">${bgOpts('')}</select><button class="btn" onclick="addM()">সদস্য যোগ করুন</button></div>
  <p style="color:var(--mut);margin:4px 0 10px">বর্তমান সদস্য সংখ্যা: ${bn(S.members.length)} জন</p>
  <div class="tw"><table>${S.members.map((m,i)=>`<tr><td class="c">${bn(i+1)}</td><td><input type="text" value="${m.name}" style="width:100%;min-width:220px" onchange="ren(${m.id},this.value)"></td><td><input type="tel" inputmode="tel" value="${m.mobile||''}" placeholder="মোবাইল নম্বর" style="width:150px" onchange="setMob(${m.id},this.value)"></td><td><select onchange="setBg(${m.id},this.value)">${bgOpts(m.blood)}</select></td><td><button class="btn sm red" onclick="del(${m.id})">${delId==m.id?'নিশ্চিত? মুছুন':'বাদ দিন'}</button></td></tr>`).join('')}</table></div></div>`;
}
function addM(){const v=$('#nn').value.trim();if(!v)return;S.members.push({id:S.nid++,name:v,mobile:($('#nm').value||'').trim(),blood:$('#nb').value});save();render()}
function setMob(id,v){const m=S.members.find(x=>x.id==id);if(m){m.mobile=v.trim();save();render()}}
const bgOpts=v=>['','A+','A-','B+','B-','O+','O-','AB+','AB-'].map(b=>`<option value="${b}" ${b==v?'selected':''}>${b||'নির্বাচন করুন'}</option>`).join('');
function setBg(id,v){const m=S.members.find(x=>x.id==id);if(m){m.blood=v;save();render()}}
function info(id){const m=S.members.find(x=>x.id==id)||{};return (m.mobile?' – মোবাইল: '+bn(m.mobile):'')+(m.blood?' – রক্তের গ্রুপ: '+m.blood:'')}
function ren(id,v){const m=S.members.find(x=>x.id==id);if(m&&v.trim()){m.name=v.trim();save()}}
function del(id){if(delId==id){S.members=S.members.filter(m=>m.id!=id);Object.values(S.pay).forEach(p=>delete p[id]);delId=0;if(sel==id)sel=S.members[0]?S.members[0].id:0;save()}else delId=id;render()}

/* ---------- ছবি (JPEG) তৈরি ---------- */
let logoImg;
const getLogo=()=>logoImg||(logoImg=new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src=LOGO}));
async function mk(w,h,title,sub,draw){
  try{await document.fonts.load('700 20px "Hind Siliguri"');await document.fonts.load('400 20px "Hind Siliguri"')}catch(e){}
  const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');
  x.fillStyle='#fffdf7';x.fillRect(0,0,w,h);x.strokeStyle='#b8892b';x.lineWidth=5;x.strokeRect(8,8,w-16,h-16);
  const F='"Hind Siliguri","Noto Sans Bengali",sans-serif';x.font='400 16px '+F;
  const im=await getLogo();if(im){x.save();x.globalAlpha=.9;x.beginPath();x.arc(72,72,50,0,Math.PI*2);x.clip();const q=Math.min(im.width,im.height);x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,22,22,100,100);x.restore()}
  x.textAlign='center';x.fillStyle='#14532d';x.font='700 28px '+F;x.fillText('মিট ক্লাব রমাদান (প্রতিষ্ঠা-২০২৫)',w/2,56);
  x.font='400 15px '+F;x.fillStyle='#6b7a70';x.fillText('নতুন রাস্তা (বাঁশ পট্টি), খুলনা',w/2,82);
  x.font='700 22px '+F;x.fillStyle='#b8892b';x.fillText(title,w/2,116);
  if(sub){x.font='400 16px '+F;x.fillStyle='#1f2a24';x.fillText(sub,w/2,142)}
  x.textAlign='left';x.fillStyle='#1f2a24';x.font='400 16px '+F;
  draw(x,w,h,F);
  if(im){const z=Math.min(w,h)*.6,cy=h/2+40,q=Math.min(im.width,im.height);x.save();x.globalAlpha=.05;x.beginPath();x.arc(w/2,cy,z/2,0,Math.PI*2);x.clip();x.drawImage(im,(im.width-q)/2,(im.height-q)/2,q,q,w/2-z/2,cy-z/2,z,z);x.restore()}
  x.globalAlpha=.3;x.fillStyle='#14532d';x.font='700 22px '+F;x.textAlign='left';x.fillText(NAME,24,h-22);x.globalAlpha=1;
  return c;
}
function tbl(x,F,left,top,cols,rows,rh){
  let y=top;
  rows.forEach((r,ri)=>{
    const hd=ri==0,last=r.total;
    x.fillStyle=hd?'#1f7a45':last?'#efe3bf':ri%2?'#f6f1e2':'#fffdf7';
    const tw=cols.reduce((a,c)=>a+c.w,0);x.fillRect(left,y,tw,rh);
    let cx=left;
    (r.cells||r).forEach((t,i)=>{
      const c=cols[i];x.fillStyle=hd?'#fff':(t==='✓'?'#1f7a45':'#1f2a24');
      x.font=(hd||last?'700 ':'400 ')+(c.fs||15)+'px '+F;x.textAlign=c.a||'left';
      const px=c.a=='center'?cx+c.w/2:c.a=='right'?cx+c.w-8:cx+8;x.fillText(t,px,y+rh*.7);cx+=c.w});
    y+=rh});
  x.strokeStyle='#e6dcc3';x.lineWidth=1;x.strokeRect(left,top,cols.reduce((a,c)=>a+c.w,0),rh*rows.length);
}
function dl(c,name){c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name+'.jpg';document.body.appendChild(a);a.click();a.remove()},'image/jpeg',.93)}
function pr(c){const i=new Image();i.src=c.toDataURL('image/jpeg',.93);const p=$('#printArea');p.innerHTML='';p.appendChild(i);i.onload=()=>{window.print()}}

const mkTok=async id=>mk(720,470,'জমার টোকেন',MON[Mo]+' '+bn(Y),(x,w,h,F)=>{
  x.font='400 18px '+F;x.fillStyle='#6b7a70';x.fillText('সদস্যের নাম:',60,205);x.fillStyle='#1f2a24';x.font='700 24px '+F;x.fillText(mname(id),60,240);
  x.font='400 18px '+F;x.fillStyle='#6b7a70';x.fillText('জমার পরিমাণ:',60,285);x.fillStyle='#1f7a45';x.font='700 30px '+F;x.fillText(tk(paid(Y,Mo,id)),60,325);
  x.fillStyle='#6b7a70';x.font='400 15px '+F;x.fillText('টোকেন নং: '+bn(id)+'-'+bn(Y)+bn(String(Mo+1).padStart(2,'0')),60,370);
  x.fillText('তারিখ: '+bn(now.toLocaleDateString('en-GB')),60,395);const mb=(S.members.find(m=>m.id==id)||{}).mobile;if(mb)x.fillText('মোবাইল নম্বর: '+bn(mb),60,420);const bg=(S.members.find(m=>m.id==id)||{}).blood;if(bg)x.fillText('রক্তের গ্রুপ: '+bg,330,420);
  x.save();x.translate(520,290);x.rotate(-.2);x.strokeStyle='#1f7a45';x.lineWidth=4;x.strokeRect(-85,-30,170,60);x.fillStyle='#1f7a45';x.font='700 32px '+F;x.textAlign='center';x.fillText('পরিশোধিত',0,11);x.restore();
  x.textAlign='center';x.fillStyle='#6b7a70';x.font='400 14px '+F;x.fillText('কোষাধ্যক্ষের স্বাক্ষর',600,400);x.beginPath();x.moveTo(520,380);x.lineTo(680,380);x.stroke();});
const dlTok=async id=>dl(await mkTok(id),'token-'+mname(id)+'-'+MON[Mo]+Y);
const prTok=async id=>pr(await mkTok(id));

const mkMonth=()=>{const n=S.members.length,rh=30;return mk(760,230+n*rh,'মাসিক জমার রিপোর্ট',MON[Mo]+' '+bn(Y),(x,w,h,F)=>{
  const rows=[['ক্র.নং','নাম','অবস্থা','টাকা'],...S.members.map((m,i)=>{const p=paid(Y,Mo,m.id);return [bn(i+1),m.name,p?'জমা ✓':'বাকি',p?bn(p):'—']}),{total:1,cells:['','মোট জমা','',bn(monthTotal(Y,Mo))+' টাকা']}];
  tbl(x,F,40,165,[{w:60,a:'center'},{w:380},{w:120,a:'center'},{w:120,a:'right'}],rows,rh)})};
const dlMonth=async()=>dl(await mkMonth(),'monthly-'+MON[Mo]+Y);
const prMonth=async()=>pr(await mkMonth());

const mkYear=()=>{const n=S.members.length,rh=30;return mk(1240,240+n*rh,'বার্ষিক জমার রিপোর্ট',bn(Y)+' সালের সর্বমোট জমা: '+tk(yearTotal(Y)),(x,w,h,F)=>{
  const cols=[{w:250},...SM.map(()=>({w:60,a:'center',fs:14})),{w:120,a:'right'}];
  const rows=[['নাম',...SM,'মোট'],...S.members.map(m=>[m.name,...SM.map((s,i)=>paid(Y,i,m.id)?'✓':'·'),bn(memYear(Y,m.id))]),{total:1,cells:['মাসিক মোট',...SM.map((s,i)=>bn(monthTotal(Y,i))),bn(yearTotal(Y))]}];
  tbl(x,F,40,165,cols,rows,rh)})};
const dlYear=async()=>dl(await mkYear(),'yearly-'+Y);
const prYear=async()=>pr(await mkYear());

const mkMem=()=>mk(640,720,'সদস্যের জমার রিপোর্ট',mname(sel)+info(sel),(x,w,h,F)=>{
  const rows=[['মাস','জমা'],...MON.map((n,i)=>[n+' '+bn(Y),paid(Y,i,sel)?tk(paid(Y,i,sel)):'বাকি']),{total:1,cells:[bn(Y)+' সালে মোট',tk(memYear(Y,sel))]},{total:1,cells:['সর্বমোট জমা (সকল বছর)',tk(memAll(sel))]}];
  tbl(x,F,60,170,[{w:320},{w:200,a:'right'}],rows,34)});
const dlMem=async()=>dl(await mkMem(),'member-'+mname(sel)+'-'+Y);
const prMem=async()=>pr(await mkMem());

/* ---------- Supabase ---------- */
async function api(p,o={},retry=true){
  const h={apikey:SB_KEY,'Content-Type':'application/json',Authorization:'Bearer '+(SES?SES.access_token:SB_KEY),...(o.headers||{})};
  const r=await fetch(SB_URL+p,{...o,headers:h});
  if(r.status==401&&SES&&retry){if(await refresh())return api(p,o,false);logout()}
  if(!r.ok)throw new Error(await r.text());
  const t=await r.text();return t?JSON.parse(t):null}
async function refresh(){try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:SES.refresh_token})});if(!r.ok)return false;SES=await r.json();localStorage.setItem('mcr_ses',JSON.stringify(SES));return true}catch(e){return false}}
async function all(p){let o=0,out=[];for(;;){const r=await api(p,{headers:{'Range-Unit':'items',Range:o+'-'+(o+999)}});out=out.concat(r);if(r.length<1000)return out;o+=1000}}
async function loadAll(){
  if(SB_URL.startsWith('PASTE')){ERR='Supabase URL ও Key এখনো বসানো হয়নি।';return}
  try{
    const [ms,ps,st]=await Promise.all([all('/rest/v1/members?select=id,name&order=sort,id'),all('/rest/v1/payments?select=member_id,year,month,amount&order=id'),api('/rest/v1/settings?select=fee&id=eq.1')]);
    const pm={};if(A)(await all('/rest/v1/members_private?select=member_id,mobile,blood&order=member_id')).forEach(p=>pm[p.member_id]=p);
    S.members=ms.map(m=>({id:m.id,name:m.name,mobile:(pm[m.id]||{}).mobile||'',blood:(pm[m.id]||{}).blood||''}));
    S.pay={};ps.forEach(p=>{const k=key(p.year,p.month);(S.pay[k]=S.pay[k]||{})[p.member_id]=p.amount});
    if(st&&st[0])S.fee=st[0].fee;
    if(!S.members.find(m=>m.id==sel))sel=S.members[0]?S.members[0].id:0;
    ERR='';
  }catch(e){ERR='ডেটা লোড করা যায়নি। ইন্টারনেট বা Supabase সেটিং দেখুন।'}}
async function run(f){try{await f()}catch(e){alert('সংরক্ষণ করা যায়নি: '+e.message)}await loadAll();render()}
function logout(){SES=null;A=false;try{localStorage.removeItem('mcr_ses')}catch(e){}tab='pay';loadAll().then(render)}
function vLogin(){$('#app').innerHTML=`<div class="card" style="max-width:380px;margin:auto"><h3 style="margin-top:0">অ্যাডমিন লগইন</h3><div class="row"><input type="text" id="em" placeholder="ইমেইল" style="width:100%"></div><div class="row"><input type="password" id="pw" placeholder="পাসওয়ার্ড" style="width:100%"></div><button class="btn" onclick="doLogin()">লগইন করুন</button> <span id="le" class="no"></span></div>`}
async function doLogin(){try{const r=await fetch(SB_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value})});if(!r.ok)throw 0;SES=await r.json();try{localStorage.setItem('mcr_ses',JSON.stringify(SES))}catch(e){}A=true;tab='pay';await loadAll();render()}catch(e){$('#le').textContent='ইমেইল বা পাসওয়ার্ড ভুল।'}}
const J=o=>JSON.stringify(o),UP={Prefer:'resolution=merge-duplicates'};
function tog(id,on){if(!A)return;run(()=>on?api('/rest/v1/payments?on_conflict=member_id,year,month',{method:'POST',headers:UP,body:J({member_id:id,year:Y,month:Mo,amount:S.fee})}):api(`/rest/v1/payments?member_id=eq.${id}&year=eq.${Y}&month=eq.${Mo}`,{method:'DELETE'}))}
function addM(){const v=$('#nn').value.trim();if(!v||!A)return;const mb=($('#nm').value||'').trim(),bg=$('#nb').value;run(async()=>{const r=await api('/rest/v1/members',{method:'POST',headers:{Prefer:'return=representation'},body:J({name:v,sort:S.members.length+1})});await api('/rest/v1/members_private?on_conflict=member_id',{method:'POST',headers:UP,body:J({member_id:r[0].id,mobile:mb,blood:bg})})})}
function ren(id,v){if(A&&v.trim())run(()=>api('/rest/v1/members?id=eq.'+id,{method:'PATCH',body:J({name:v.trim()})}))}
const upP=(id,o)=>run(()=>api('/rest/v1/members_private?on_conflict=member_id',{method:'POST',headers:UP,body:J({member_id:id,...o})}));
function setMob(id,v){if(A)upP(id,{mobile:v.trim()})}
function setBg(id,v){if(A)upP(id,{blood:v})}
function setFee(v){if(A)run(()=>api('/rest/v1/settings?id=eq.1',{method:'PATCH',body:J({fee:+v||0})}))}
function del(id){if(!A)return;if(delId==id){delId=0;run(()=>api('/rest/v1/members?id=eq.'+id,{method:'DELETE'}))}else{delId=id;render()}}
loadAll().then(()=>{LOADING=false;render()});
</script>
